<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SCP Catalog</title>
    <style>
      html, body {
        min-height: 100%;
        margin: 0;
        background: #020604;
        color: #b7f5ca;
        font-family: "Courier New", ui-monospace, monospace;
      }

      .loader {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        text-align: center;
      }

      .loader-box {
        border: 1px solid rgba(45, 255, 136, 0.25);
        border-radius: 22px;
        background: rgba(0, 0, 0, 0.35);
        box-shadow: 0 20px 80px rgba(0, 0, 0, 0.45);
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <main class="loader">
      <div class="loader-box" id="status">Loading catalog...</div>
    </main>

    <script>
      (() => {
      const WORKER_URL = "https://morning-boat-680a.soninlaw1716.workers.dev";

      function normalizeUploadedHtmlPaths(html) {
        const replacements = {
          "SCP assets/Scp foundation logo white.png": "scp-assets/scp-foundation-logo-white.png",
          "SCP assets/scp foundation logo black.png": "scp-assets/scp-foundation-logo-black.png",
          "SCP assets/Safe_class_Logo.png": "scp-assets/safe-class-logo.png",
          "SCP assets/Euclid_class_logo.png": "scp-assets/euclid-class-logo.png",
          "SCP assets/_Keter_class_logo.png": "scp-assets/keter-class-logo.png",
          "SCP assets/Apollyon_class_logo.png": "scp-assets/apollyon-class-logo.png",
          "SCP assets/Archon class scp.png": "scp-assets/archon-class-logo.png",
          "SCP assets/decommisoned class logo.png": "scp-assets/decommissioned-class-logo.png",
          "SCP assets/Explained class logo.png": "scp-assets/explained-class-logo.png",
          "SCP assets/Hiemal class logo.png": "scp-assets/hiemal-class-logo.png",
          "SCP assets/Thaumiel_class_logo.png": "scp-assets/thaumiel-class-logo.png",
          "SCP assets/Ticonderoga class logo.png": "scp-assets/ticonderoga-class-logo.png",
        };
        return Object.entries(replacements).reduce((updated, [oldPath, newPath]) => updated.replaceAll(oldPath, newPath), html);
      }

      async function loadPortalHtml() {
        const status = document.getElementById("status");
        try {
          const response = await fetch(`${WORKER_URL}/api/portal-html`, { cache: "no-store" });
          if (!response.ok) throw new Error(`Worker returned ${response.status}`);
          const html = normalizeUploadedHtmlPaths(await response.text());
          if (!html.trim()) {
            status.textContent = "No portal HTML uploaded yet.";
            return;
          }

          document.open();
          document.write(html);
          document.close();
        } catch (error) {
          status.textContent = `Could not load portal HTML: ${error.message}`;
        }
      }

      loadPortalHtml();
      })();
    </script>
  </body>
</html>
